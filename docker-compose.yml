version: '3.8'

services:
  backend:
    build: ./backend
    container_name: myapp-backend
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env  # Pamiętaj, aby stworzyć ten plik na VPS!

  frontend:
    build: ./frontend
    container_name: myapp-frontend
    restart: always
    ports:
      - "3001:80" # Mapujemy port 80 kontenera na 3000 VPSa
    depends_on:
      - backend