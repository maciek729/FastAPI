version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: myapp-db
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: myapp-backend
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env 
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: myapp-frontend
    restart: always
    ports:
      - "3001:80" 
    depends_on:
      - backend

  adminer:
    image: adminer
    container_name: myapp-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: