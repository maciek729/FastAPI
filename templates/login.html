{% include 'layout.html' %}

<div class="container">
    <div class="card">
        <div class="card-header">
        </div>
        <div class="card-body">
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" class="form-control" name="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" name="password" autocomplete="current_password" required>
                </div>
                <button type="submit" class="btn btn-primary">Zaloguj</button>
            </form>
        </div>
        <div class="card-footer text-muted">
            <p>Nie masz konta? <a href="/auth/register-page">Zarejestruj się</a></p>
            <a href="/auth/forgot-password-page">Nie pamiętam hasła.</a>
        </div>

    </div>
</div>
